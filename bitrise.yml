format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

meta:
  bitrise.io:
    stack: linux-docker-android-22.04

trigger_map:
- push_branch: "*"
  workflow: primary
- pull_request_source_branch: "*"
  workflow: primary

workflows:
  primary:
    summary: Build MERCON Driver Release APK
    description: Builds a universal (arm64-v8a + armeabi-v7a) release APK for the driver app
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - set-java-version@1:
        inputs:
        - set_java_version: '17'
    - script@1:
        title: Prebuild & Build Driver APK
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex

            # ── 1. Install dependencies (mobile npm workspace root) ─────────
            cd frontend/mobile-app
            npm install
            cd mercon-app

            # ── 2. Generate native android/ folder ─────────────────────────
            npx expo prebuild --platform android --no-install

            # ── 3. Configure gradle architectures for phones (arm64 + armv7) ─
            echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a" >> android/gradle.properties
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

            # ── 4. Patch MainActivity.kt: setTheme(AppTheme) + try/catch SplashScreen
            MAIN_ACTIVITY="android/app/src/main/java/tech/merconmobile/app/MainActivity.kt"
            if grep -q 'SplashScreenManager.registerOnActivity(this)' "$MAIN_ACTIVITY" && \
               ! grep -q 'SplashScreenManager failed' "$MAIN_ACTIVITY"; then
              sed -i 's/SplashScreenManager\.registerOnActivity(this)/setTheme(R.style.AppTheme)\n    try {\n      SplashScreenManager.registerOnActivity(this)\n    } catch (e: Throwable) {\n      android.util.Log.w("MainActivity", "SplashScreenManager failed: \${e.message}")\n    }/' "$MAIN_ACTIVITY"
              echo "✅ MainActivity.kt theme and splash patch applied"
            else
              echo "ℹ️ MainActivity.kt already patched or call not found"
            fi

            # ── 5. Build release APK ────────────────────────────────────────
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

            # ── 6. Copy APK to Bitrise deploy dir ──────────────────────────
            mkdir -p "$BITRISE_DEPLOY_DIR"
            cp app/build/outputs/apk/release/*.apk "$BITRISE_DEPLOY_DIR/mercon-driver-app.apk"
            echo "✅ APK copied to deploy directory successfully."
    - deploy-to-bitrise-io@2:
        inputs:
        - is_enable_public_page: 'true'
