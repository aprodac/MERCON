server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. The built dashboard is ~6 MB of JS/CSS and was
    # being served raw — nginx's default `gzip off` means every cold load
    # downloaded all of it uncompressed. Gzipped it is ~1.7 MB.
    #
    # `gzip_types` deliberately does not list text/html: nginx always gzips
    # that when gzip is on, and naming it again logs a duplicate-MIME warning.
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # Docker healthcheck target. `location =` (exact match) always takes
    # precedence over the `location /` prefix block below regardless of
    # source order, so this can't interfere with SPA routing.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Customer tracking pages (/t/<token> one trip, /c/<token> all of a
    # customer's trucks): the same app, served from track.html — a copy of
    # index.html with one SSI include (added in the Dockerfile) that pulls the
    # link's Open Graph tags from the API. WhatsApp reads those without running
    # any script, so the chat shows "Track VRA-3358 · arrives 21:15" instead of
    # the generic site title. If the API is slow or down the include is silently
    # empty and the page is served as usual.
    location ~ ^/(t|c)/[A-Za-z0-9_-]{16,64}$ {
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-cache, must-revalidate";
        rewrite ^ /track.html break;
    }

    # The tags themselves — only reachable from the include above. The API's
    # name is looked up per request through Docker's DNS (a variable in
    # proxy_pass), so this container still starts when the API is down.
    location ~ ^/__og/(t|c)/([A-Za-z0-9_-]{16,64})$ {
        internal;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $og_api http://mercon-api:3000;
        proxy_pass $og_api/public/og/$1/$2;
        proxy_set_header X-Public-Host $host;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }

    # Handle single page app routing
    location / {
        try_files $uri /index.html;
    }

    # index.html is the deploy pointer: it names the current hashed bundles, so
    # a cached copy keeps sending browsers to the PREVIOUS deploy's files.
    # It must always be revalidated, even though the assets it points at are
    # cached hard below.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite fingerprints these filenames, so a given URL's content never changes
    # — `immutable` lets the browser skip even the revalidation request.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
    }
}
