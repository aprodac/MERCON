# ── Catch-all: reject unknown HTTPS hosts ─────────────────────────────
# This file MUST sort first alphabetically (00-*) so it loads before any
# named server block.  Any TLS handshake whose Host / SNI does not match
# a later, more-specific server_name gets terminated here with 444
# (Nginx drops the connection — no response body, no redirect).
#
# WHY THIS EXISTS:
# Without an explicit default_server on port 443, Nginx silently picks
# the first listen-443 block it loads (alphabetical by filename).  If
# that happens to be DEV, every unmatched HTTPS request — including
# mercon.tech when its own 443 block is missing — routes to DEV.
# This catch-all prevents that permanently.
#
# Managed by repo — CI/CD copies this file to /etc/nginx/sites-available/
# and symlinks it into sites-enabled.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Re-use the production cert for the TLS handshake.  The handshake
    # must complete before Nginx can read the Host header and decide to
    # reject, so a valid cert is required even for the catch-all.
    ssl_certificate     /etc/letsencrypt/live/mercon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercon.tech/privkey.pem;

    # Drop the connection immediately — no response body, no redirect.
    return 444;
}
