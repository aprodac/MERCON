# ── Catch-all for the DEV server: reject unknown HTTPS hosts ───────────
# Same job as 00-default-ssl.conf on the production server, but the dev
# server only holds the dev.mercon.tech certificate, so the TLS handshake
# uses that one. Without an explicit default_server, nginx would answer any
# HTTPS request for an unknown host with the first 443 block it loaded.
#
# Managed by repo — ci-cd-dev.yml installs it on the dev server.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/dev.mercon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.mercon.tech/privkey.pem;

    return 444;
}
