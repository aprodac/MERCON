# MERCON VPS Nginx Reverse Proxy Config
# Managed by repo — do NOT hand-edit on the server directly.
# CI/CD copies this file to /etc/nginx/sites-available/ and reloads nginx.

# ── API Subdomain (HTTP → HTTPS redirect) ────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.mercon.tech api.mercon.app;

    return 301 https://$host$request_uri;
}

# ── API Subdomain (HTTPS) ────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.mercon.tech api.mercon.app;

    ssl_certificate     /etc/letsencrypt/live/mercon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercon.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow real photo uploads (default nginx limit is 1MB — way too small).
    # Multer on the Express side allows up to 10MB; set this slightly higher
    # so nginx never rejects before Express can return a useful error.
    client_max_body_size 250m;

    location / {
        proxy_pass         http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generous timeouts for large file uploads on mobile connections
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ── Main Web Dashboard + API Proxy (HTTP → HTTPS redirect) ──────────
server {
    listen 80;
    listen [::]:80;
    server_name mercon.tech www.mercon.tech mercon.app www.mercon.app;

    return 301 https://$host$request_uri;
}

# ── Main Web Dashboard + API Proxy (HTTPS) ───────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mercon.tech www.mercon.tech mercon.app www.mercon.app;

    ssl_certificate     /etc/letsencrypt/live/mercon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercon.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 250m;

    location /api/ {
        client_max_body_size 250m;
        proxy_pass         http://127.0.0.1:3050/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        client_max_body_size 250m;
        proxy_pass         http://127.0.0.1:3050/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3050/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
