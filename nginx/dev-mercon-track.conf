# MERCON customer links — dev (track-dev.mercon.tech)
# Managed by repo. CI copies and enables this file ONLY when the certificate
# below exists on the server — until then it is skipped and nothing changes.
#
# The customer-links address: tracking pages (/t/, /c/) and forwarded driver
# updates (/s/) only. The dashboard, its sign-in page and the private API are
# not reachable here, so trimming a link never shows the company's login.

server {
    listen 80;
    listen [::]:80;
    server_name track-dev.mercon.tech;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name track-dev.mercon.tech;

    ssl_certificate     /etc/letsencrypt/live/track-dev.mercon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track-dev.mercon.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Never index customer pages.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The public API the pages call: tracking data, preview cards, shares.
    location /api/public/ {
        proxy_pass         http://127.0.0.1:3051/public/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Company name / logo / colour for the page (no sign-in needed).
    location = /api/settings/public {
        proxy_pass         http://127.0.0.1:3051/settings/public;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else in the API stays on the dashboard's address.
    location /api/ {
        return 404;
    }

    # Customer logos, driver photos, proof-of-delivery media.
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3051/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # The web app. On this host it only routes /t/, /c/ and /s/ (anything else
    # shows "This page isn't available"); the container adds the WhatsApp
    # preview tags for /t/ and /c/.
    location / {
        proxy_pass         http://127.0.0.1:3061;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
