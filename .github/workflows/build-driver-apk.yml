name: Build MERCON Driver APK (Manual Backup)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/mobile-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Mobile npm workspace root (apps + shared code); lockfile lives here.
      - name: Install dependencies
        working-directory: frontend/mobile-app
        run: npm ci || npm install

      - name: Expo Prebuild (Generate Android native project)
        working-directory: frontend/mobile-app/driver-app
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK
        working-directory: frontend/mobile-app/driver-app/android
        run: |
          echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: mercon-driver-app
          path: frontend/mobile-app/driver-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
