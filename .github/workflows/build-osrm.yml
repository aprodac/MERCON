name: Build Route Server Map (OSRM)

# Our own road-routing server: real road ETAs and route lines with no request
# limits and no third party (docs/infra/ROUTING.md).
#
#   build    on a GitHub-hosted runner, never on the VPS — turning the map
#            into routing data needs several GB of RAM and the VPS has 3.8 GB
#            shared by production, dev and the runner (a build that ran it out
#            of memory once took the runner down with it). Downloads the Gulf
#            map (OpenStreetMap, Geofabrik), keeps only the roads, prepares it
#            for OSRM, checks a Riyadh → Jeddah route, and uploads the result.
#   install  on the production runner: unpacks it next to the release before,
#            points /var/lib/mercon/osrm/current at it, (re)starts the `osrm`
#            service and checks a route through the API container. A failed
#            check puts the previous map back and fails the job.
#
# Production must already be on a release whose docker-compose.yml has the
# `osrm` service. Until this has run once the API uses the public OSRM demo,
# exactly as before. Runs monthly so new roads appear; or run it by hand.

on:
  schedule:
    - cron: '23 1 3 * *' # 01:23 UTC on the 3rd of every month (04:23 in Riyadh)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  OSRM_IMAGE: ${{ vars.OSRM_IMAGE || 'ghcr.io/project-osrm/osrm-backend:v5.27.1' }}
  # Saudi Arabia is in Geofabrik's GCC States extract (with the UAE, Kuwait,
  # Qatar, Bahrain and Oman — cross-border trips route too).
  MAP_URL: ${{ vars.OSRM_MAP_URL || 'https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf' }}

jobs:
  build:
    name: Build routing data (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Make room
        run: |
          set -euo pipefail
          # The hosted runner has ~7 GB RAM; swap is the safety net for osrm-extract's peak.
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -h; df -h /mnt

      - name: Download the map
        working-directory: /mnt
        run: |
          set -euo pipefail
          sudo install -d -m 777 /mnt/osrm
          cd /mnt/osrm
          curl -fSL --retry 4 --retry-delay 10 -o full.osm.pbf "$MAP_URL"
          ls -lh full.osm.pbf

      - name: Keep only the roads
        working-directory: /mnt/osrm
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool pigz
          # Roads a truck can use, their turn restrictions — and nothing else
          # (buildings, land use and footpaths are most of the file). Smaller
          # data is a smaller, faster route server on the VPS.
          osmium tags-filter full.osm.pbf \
            w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road \
            r/type=restriction \
            -o map.osm.pbf --overwrite
          rm full.osm.pbf
          ls -lh map.osm.pbf

      - name: Prepare for OSRM (extract · partition · customize)
        working-directory: /mnt/osrm
        run: |
          set -euo pipefail
          docker pull -q "$OSRM_IMAGE"
          run() { docker run --rm -v "$PWD:/data" "$OSRM_IMAGE" "$@"; }
          run osrm-extract -p /opt/car.lua /data/map.osm.pbf
          run osrm-partition /data/map.osrm
          run osrm-customize /data/map.osrm
          rm map.osm.pbf
          du -sh .

      - name: Check a real route (Riyadh → Jeddah)
        working-directory: /mnt/osrm
        run: |
          set -euo pipefail
          docker run -d --name osrm-check -p 5000:5000 -v "$PWD:/data:ro" "$OSRM_IMAGE" osrm-routed --algorithm mld --mmap=true /data/map.osrm
          for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:5000/route/v1/driving/46.6753,24.7136;39.8262,21.4225?overview=false" -o route.json 2>/dev/null && break; sleep 2; done
          docker logs osrm-check | tail -5
          docker rm -f osrm-check >/dev/null
          cat route.json; echo
          # Riyadh → Jeddah is ~950 km by road; anything far off means broken data.
          python3 - <<'PY'
          import json, sys
          r = json.load(open('route.json'))
          assert r.get('code') == 'Ok', r.get('code')
          km = r['routes'][0]['distance'] / 1000
          print(f'Riyadh → Jeddah: {km:.0f} km by road')
          sys.exit(0 if 800 < km < 1200 else 'route distance looks wrong')
          PY
          rm route.json

      - name: Pack
        working-directory: /mnt/osrm
        run: |
          set -euo pipefail
          # OSRM ran as root in Docker and wrote some files root-only (map.osrm.fileIndex).
          sudo chown -R "$(id -u):$(id -g)" .
          # gzip, not zstd: the VPS is sure to have gzip.
          tar -I pigz -cf /mnt/osrm/osrm-data.tar.gz map.osrm*
          ls -lh /mnt/osrm/osrm-data.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: osrm-data
          path: /mnt/osrm/osrm-data.tar.gz
          compression-level: 0 # already gzip
          retention-days: 2

  install:
    name: Install on production
    needs: build
    runs-on: [self-hosted, prod]
    timeout-minutes: 30
    # Never alongside a deploy or a rollback (same group as ci-cd.yml).
    concurrency:
      group: ci-cd-main
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /opt/mercon/prod
      OSRM_ROOT: /var/lib/mercon/osrm
      CLIENT_NAME: mercon
      COMPOSE_PROJECT_NAME: mercon
      APP_UPLOADS_DIR: /var/lib/mercon/mercon-app-uploads
      TMP_UPLOADS_DIR: /var/lib/mercon/mercon-uploads
      # docker compose interpolates every variable in the file, so the deploy's
      # required values are needed even though only `osrm` is touched.
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: osrm-data
          path: ${{ runner.temp }}/osrm

      - name: Unpack, switch and check
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          if ! docker compose -p mercon --profile routing config --services | grep -qx osrm; then
            echo "::error::Production's docker-compose.yml has no osrm service yet — deploy the release that adds it first, then run this again." >&2
            exit 1
          fi

          ARCHIVE="${{ runner.temp }}/osrm/osrm-data.tar.gz"
          NEW="$OSRM_ROOT/releases/$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          FREE_KB=$(df --output=avail -k / | tail -1)
          NEED_KB=$(( $(stat -c %s "$ARCHIVE") * 4 / 1024 ))
          if [ "$FREE_KB" -lt "$NEED_KB" ]; then
            echo "::error::Not enough disk for the new map ($((NEED_KB/1024)) MB needed, $((FREE_KB/1024)) MB free). Nothing changed." >&2
            exit 1
          fi
          sudo install -d -m 755 "$NEW"
          sudo tar -xzf "$ARCHIVE" -C "$NEW"
          rm -f "$ARCHIVE"
          du -sh "$NEW"

          PREV="$(readlink -f "$OSRM_ROOT/current" 2>/dev/null || true)"
          sudo ln -sfn "$NEW" "$OSRM_ROOT/current"

          start_osrm() { docker compose -p mercon --profile routing up -d --no-deps --force-recreate osrm; }
          route_ok() {
            # Asked from inside the API container — the same path the API uses.
            for i in $(seq 1 45); do
              if docker exec mercon-api curl -fsS --max-time 5 "http://osrm:5000/route/v1/driving/46.6753,24.7136;39.8262,21.4225?overview=false" 2>/dev/null | grep -q '"code":"Ok"'; then return 0; fi
              sleep 2
            done
            return 1
          }

          start_osrm
          if route_ok; then
            echo "✓ Route server answers on real roads (Riyadh → Jeddah)."
          else
            docker compose -p mercon logs --no-color --tail=40 osrm || true
            if [ -n "$PREV" ] && [ -d "$PREV" ] && [ "$PREV" != "$NEW" ]; then
              echo "::error::The new map did not answer — putting the previous one back." >&2
              sudo ln -sfn "$PREV" "$OSRM_ROOT/current"
              start_osrm
            else
              echo "::error::The route server did not answer and there is no earlier map — stopping it. The API keeps using the public OSRM server." >&2
              docker compose -p mercon --profile routing stop osrm || true
            fi
            sudo rm -rf "$NEW"
            exit 1
          fi

          # Keep the live map and the one before it; drop older ones.
          KEEP="$(basename "$NEW") $( [ -n "$PREV" ] && basename "$PREV" )"
          for d in "$OSRM_ROOT"/releases/*; do
            case " $KEEP " in *" $(basename "$d") "*) ;; *) sudo rm -rf "$d" ;; esac
          done
          ls -1 "$OSRM_ROOT/releases"
          docker compose -p mercon --profile routing ps osrm
          df -h /
