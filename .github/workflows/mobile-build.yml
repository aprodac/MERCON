name: Mobile App CI/CD (Expo EAS)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android App (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/mobile-app/mercon-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: './frontend/mobile-app/package-lock.json'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/mobile-app

      - name: Build Android App
        run: eas build --platform android --profile preview --non-interactive --no-wait
