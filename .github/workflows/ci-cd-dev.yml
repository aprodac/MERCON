name: CI/CD Pipeline (Dev)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

# See ci-cd.yml for why this exists: this runner queued overlapping runs on
# rapid successive pushes, and each one's actions/checkout download piled on
# top of the others until GitHub's per-IP rate limit (429) started failing
# runs outright. Queuing (not canceling) so a mid-flight `docker compose up
# --build` is never interrupted.
concurrency:
  group: ci-cd-dev
  cancel-in-progress: false


jobs:
  deploy:
    name: Deploy dev stack to Self-Hosted Runner
    # The dev server (82.29.167.128). Its runner has only the `dev` label (no
    # generic `self-hosted`), so production jobs can never land there.
    runs-on: [dev]

    steps:
      # Disk report and build-cache cleanup only. This step used to truncate
      # every log under /var/log (auth.log included), vacuum journald to one
      # day and empty all container logs on every dev push, which erased the
      # server's audit trail each time. Logs are left alone now: container
      # logs are capped by docker-compose.yml (json-file 20 MB x 3) and system
      # logs by logrotate/journald.
      - name: Disk check and build-cache cleanup
        run: |
          df -h / || true
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
          # Dangling images and build cache older than 3 days. Never volumes,
          # never tagged images.
          docker image prune -f 2>/dev/null || true
          docker builder prune -af --filter "until=72h" 2>/dev/null || true
          df -h / || true

      # Native git instead of actions/checkout — see ci-cd.yml for why: this
      # runner's work directory persists between runs, so the marketplace
      # action bundle was being re-downloaded from codeload.github.com on
      # every deploy for no reason. git is already on the runner.
      - name: Checkout Code (native git — avoids actions/checkout download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # actions/checkout normally adds this safe.directory exception itself;
          # without it git refuses to touch a workspace it doesn't own (this
          # runner's job dir is root-owned, the runner process usually isn't).
          # `git config --global` needs $HOME, which this runner's job shell
          # doesn't set — GIT_CONFIG_* env vars inject the same config with no
          # file and no $HOME dependency.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if [ -d .git ]; then
            git remote set-url origin "$REPO_URL"
            git fetch --force --prune origin "$GITHUB_SHA" || git fetch --force --prune origin dev
            git checkout --force "$GITHUB_SHA" || git checkout --force origin/dev
            git clean -fdx
          else
            git init -q
            git remote add origin "$REPO_URL"
            git fetch --depth 1 origin "$GITHUB_SHA" || git fetch --depth 1 origin dev
            git checkout --force FETCH_HEAD
          fi

      - name: Rebuild and Restart Dev Docker Containers
        env:
          # Dev credentials come from DEV_* secrets only. There is no fallback:
          # an unset DEV_* secret used to silently become the PRODUCTION secret
          # (or a password written in this file), so dev could run with prod's
          # JWT signing key and database password. A missing required secret
          # now stops the deploy below. Optional integrations (ICCES, Gemini)
          # stay off on dev unless their DEV_* secret is set.
          CLIENT_NAME: dev
          POSTGRES_DB: mercon_dev_db
          POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.DEV_SEED_ADMIN_PASSWORD }}
          API_PORT: 3051
          FRONTEND_PORT: 3061
          DB_TUNNEL_PORT: 15433
          APP_UPLOADS_DIR: /var/lib/mercon/dev-app-uploads
          TMP_UPLOADS_DIR: /var/lib/mercon/dev-uploads
          ICCES_USER: ${{ secrets.DEV_ICCES_USER }}
          ICCES_PASS: ${{ secrets.DEV_ICCES_PASS }}
          ICCES_ACCT: ${{ secrets.DEV_ICCES_ACCT }}
          GEMINI_API_KEY: ${{ secrets.DEV_GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.DEV_GEMINI_MODEL || 'gemini-flash-latest' }}
        run: |
          echo "=== REBUILDING DEV STACK (mercon-dev) ==="
          echo "Target Project: mercon-dev (CLIENT_NAME=dev)"

          MISSING=""
          for V in POSTGRES_USER POSTGRES_PASSWORD JWT_SECRET SEED_ADMIN_PASSWORD; do
            [ -n "${!V}" ] || MISSING="$MISSING DEV_$V"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING. Dev never falls back to production secrets; add them under Settings > Secrets and variables > Actions. Nothing was changed." >&2
            exit 1
          fi

          # Per-client secrets live on this server, not in GitHub
          # (scripts/provision/client-secrets.sh, docs/CLIENT_SECRETS.md).
          # `ensure` creates dev's own data encryption key on the first deploy
          # and never replaces it; a missing or malformed key stops the deploy
          # here, before anything is built or restarted.
          sudo bash scripts/provision/client-secrets.sh ensure "$CLIENT_NAME"
          eval "$(sudo bash scripts/provision/client-secrets.sh export "$CLIENT_NAME")"
          echo "::add-mask::$DATA_ENCRYPTION_KEY"
          [ -n "$DATA_ENCRYPTION_KEY_PREVIOUS" ] && echo "::add-mask::$DATA_ENCRYPTION_KEY_PREVIOUS"
          if [ -z "$DATA_ENCRYPTION_KEY" ]; then
            echo "ERROR: no DATA_ENCRYPTION_KEY for client '$CLIENT_NAME'. Aborting deploy." >&2
            exit 1
          fi

          # Uploads live under /var/lib/mercon (docker-compose.yml). Copies
          # anything still in the old /tmp locations; never deletes them.
          sudo bash scripts/provision/migrate-uploads.sh /tmp/dev-uploads "$APP_UPLOADS_DIR"
          sudo bash scripts/provision/migrate-uploads.sh /tmp/mercon-dev-tmp-uploads "$TMP_UPLOADS_DIR"

          echo "Disk space available immediately prior to build:"
          df -h / || true

          echo "Building mercon-dev images (running container remains untouched during build)..."
          # One image at a time: building the API and the web dashboard in
          # parallel peaked above this host's 3.8 GB RAM and the OOM killer took
          # out docker-buildx and the runner service with it (2026-09-27).
          docker compose -p mercon-dev build mercon-api
          docker compose -p mercon-dev build mercon-frontend

          # The migration below runs with --no-deps, so the database must
          # already be up. On a fresh server (first deploy) nothing has started
          # it yet; on later deploys this is a no-op for a running database.
          echo "Ensuring the dev database is running and healthy..."
          docker compose -p mercon-dev up -d --wait postgres-db

          echo "Executing Prisma database migrations with newly built image..."
          docker compose -p mercon-dev run --rm --no-deps mercon-api npx prisma migrate deploy

          echo "Recreating and restarting mercon-dev containers..."
          docker compose -p mercon-dev up -d --no-build
          # Second pass: anything the old container wrote during this deploy.
          sudo bash scripts/provision/migrate-uploads.sh --finalize /tmp/dev-uploads "$APP_UPLOADS_DIR"
          sudo bash scripts/provision/migrate-uploads.sh --finalize /tmp/mercon-dev-tmp-uploads "$TMP_UPLOADS_DIR"

          echo "Waiting for mercon-api service container to achieve healthy status (bounded 60s timeout)..."
          HEALTH_STATUS="unknown"
          TIMEOUT=60
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONTAINER_ID=$(docker compose -p mercon-dev ps -q mercon-api 2>/dev/null || echo "")
            if [ -n "$CONTAINER_ID" ]; then
              HEALTH_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$CONTAINER_ID" 2>/dev/null || echo "container-not-found")
            else
              HEALTH_STATUS="container-not-found"
            fi

            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "✓ Service mercon-api container (ID: ${CONTAINER_ID:0:12}) reported healthy state after ${ELAPSED}s."
              break
            elif [ "$HEALTH_STATUS" = "unhealthy" ]; then
              echo "::error::Service mercon-api container reported UNHEALTHY state." >&2
              break
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          echo "--- mercon-api service container status ---"
          docker compose -p mercon-dev ps mercon-api || true

          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "::error::Deployment failed! Service mercon-api container did not achieve healthy status (Status: '$HEALTH_STATUS'). Printing logs..." >&2
            echo "--- mercon-api logs (last 100 lines) ---"
            docker compose -p mercon-dev logs --no-color --tail=100 mercon-api || true
            exit 1
          fi

          echo "--- Verifying external health endpoint ---"
          if ! curl -fsS http://127.0.0.1:3051/health; then
            echo "::error::Deployment failed! External health probe GET http://127.0.0.1:3051/health failed or returned non-200. Printing logs..." >&2
            echo "--- mercon-api logs (last 100 lines) ---"
            docker compose -p mercon-dev logs --no-color --tail=100 mercon-api || true
            exit 1
          fi
          echo "✓ External health probe GET http://127.0.0.1:3051/health verified successfully."



          echo "=== FINAL DISK AND DOCKER STORAGE STATE ==="
          df -h / || true
          docker system df || true
          echo "Active containers after deployment (Production verified untouched):"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true

      - name: Deploy Nginx Config for Dev & Reload
        run: |
          echo "Deploying dev nginx config..."

          # Deploy catch-all default SSL block (rejects unknown HTTPS hosts)
          # Both pipelines deploy this to guarantee the safety net is always present.
          # The dev server has only the dev.mercon.tech certificate, so it gets
          # its own catch-all (00-default-ssl.conf needs the mercon.tech one).
          if [ -f nginx/00-default-ssl-dev.conf ]; then
            sudo cp nginx/00-default-ssl-dev.conf /etc/nginx/sites-available/00-default-ssl.conf
            sudo ln -sf /etc/nginx/sites-available/00-default-ssl.conf /etc/nginx/sites-enabled/00-default-ssl.conf
          fi

          # Deploy dev nginx config
          if [ -f nginx/dev-mercon-api.conf ]; then
            sudo cp nginx/dev-mercon-api.conf /etc/nginx/sites-available/dev-mercon-api.conf
            sudo ln -sf /etc/nginx/sites-available/dev-mercon-api.conf /etc/nginx/sites-enabled/dev-mercon-api.conf
          fi

          # Update dev nginx site configs strictly (*dev*) to proxy to dev API port 3051 and dev Frontend port 3061
          sudo sed -i 's/127\.0\.0\.1:3050/127.0.0.1:3051/g' /etc/nginx/sites-available/*dev* /etc/nginx/sites-enabled/*dev* 2>/dev/null || true
          sudo sed -i 's/127\.0\.0\.1:3060/127.0.0.1:3061/g' /etc/nginx/sites-available/*dev* /etc/nginx/sites-enabled/*dev* 2>/dev/null || true

          # Ensure production configs (mercon-api.conf) strictly proxy to production ports (API: 3050, Frontend: 3060)
          if [ -f /etc/nginx/sites-available/mercon-api.conf ]; then
            sudo sed -i 's/127\.0\.0\.1:3051/127.0.0.1:3050/g' /etc/nginx/sites-available/mercon-api.conf 2>/dev/null || true
            sudo sed -i 's/127\.0\.0\.1:3061/127.0.0.1:3060/g' /etc/nginx/sites-available/mercon-api.conf 2>/dev/null || true
          fi
          if [ -f /etc/nginx/sites-enabled/mercon-api.conf ]; then
            sudo sed -i 's/127\.0\.0\.1:3051/127.0.0.1:3050/g' /etc/nginx/sites-enabled/mercon-api.conf 2>/dev/null || true
            sudo sed -i 's/127\.0\.0\.1:3061/127.0.0.1:3060/g' /etc/nginx/sites-enabled/mercon-api.conf 2>/dev/null || true
          fi

          # Validate config before reloading
          sudo nginx -t
          sudo systemctl reload nginx || sudo service nginx reload || true
          echo "Dev nginx config deployed and reloaded."

