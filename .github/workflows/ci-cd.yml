name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

# Rapid successive pushes used to queue up overlapping runs on this single
# self-hosted runner, each downloading the actions/checkout bundle from
# codeload.github.com at nearly the same moment — enough in a burst to trip
# GitHub's per-IP rate limit (429) and fail the whole run before it ever
# touched Docker. Queuing (not canceling) means a mid-flight `docker compose
# up --build` is never interrupted; the newest push still deploys, just after
# the one ahead of it finishes.
concurrency:
  group: ci-cd-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Self-Hosted Runner
    runs-on: [self-hosted, prod]
    env:
      DEPLOY_DIR: /opt/mercon/prod
    # Releases reach main through a reviewed dev → main PR (docs/RELEASE_PROCESS.md);
    # release-check.yml reports on the PR, this workflow deploys the merge.

    steps:
      # Production is built from its own directory, not the runner's work
      # directory. Every other job this runner takes (release-check on PRs,
      # backup-db and db-inspect from the default branch, seed/demo/sync)
      # checks out code into the work directory, and before this change the
      # live `mercon` Compose project pointed there — whatever branch the last
      # job left behind is what a manual `docker compose up` or an hPanel
      # Docker "update" would have rebuilt production from.
      #
      # Native git instead of actions/checkout: the marketplace action bundle
      # was re-downloaded from codeload.github.com on every deploy and tripped
      # GitHub's per-IP rate limit (429). Shallow fetch + gc keeps .git at one
      # commit's worth of objects instead of growing with every release.
      - name: Checkout Code into the production deploy directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo install -d -m 755 -o "$(id -u)" -g "$(id -g)" "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          # `git config --global` needs $HOME, which this runner's job shell
          # doesn't set — GIT_CONFIG_* env vars inject the same config.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$DEPLOY_DIR"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          [ -d .git ] || { git init -q && git remote add origin "$REPO_URL"; }
          git remote set-url origin "$REPO_URL"
          git fetch --depth 1 --force origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD
          git clean -fdx
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
          git reflog expire --expire=now --all && git gc --prune=now --quiet
          echo "Deploying $(git rev-parse --short HEAD) from $DEPLOY_DIR ($(du -sh .git | cut -f1) .git)"

      - name: Rebuild and Restart Docker Containers
        env:
          CLIENT_NAME: mercon
          COMPOSE_PROJECT_NAME: mercon
          # Persistent upload directories (docker-compose.yml defaults, spelled
          # out so the migration step and the mounts cannot disagree).
          APP_UPLOADS_DIR: /var/lib/mercon/mercon-app-uploads
          TMP_UPLOADS_DIR: /var/lib/mercon/mercon-uploads
          # Injected into docker compose interpolation; stored as GitHub
          # Actions secrets, never committed. Rotating JWT_SECRET invalidates
          # all existing JWTs (everyone must log in again). Rotating
          # POSTGRES_PASSWORD does NOT reset data in the pgdata volume, but
          # must match whatever the volume's Postgres user was created with.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          # ICCES GPS tracking — optional. Absent secrets leave these empty,
          # which disables polling; the deploy is not blocked on them.
          ICCES_USER: ${{ secrets.ICCES_USER }}
          ICCES_PASS: ${{ secrets.ICCES_PASS }}
          ICCES_ACCT: ${{ secrets.ICCES_ACCT }}
          # Gemini Vision AI — injected from repo/environment secrets only.
          # (A hardcoded fallback key used to live here; it's committed in git
          # history and must be treated as leaked — rotate it in Google AI
          # Studio and set the new value as the GEMINI_API_KEY repo secret.)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-flash-latest' }}
          # Google address autocomplete. Reaches the frontend as a
          # docker-compose build arg, because Vite inlines VITE_* at build time
          # — a runtime env var would arrive after the bundle is written.
          # Optional like the ICCES pair above: without it address search falls
          # back to Nominatim, so a missing key degrades one feature rather
          # than failing the deploy.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          cd "$DEPLOY_DIR"
          echo "Rebuilding backend and frontend services..."
          # docker-compose.yml lives at the repo root (workspace-aware builds)

          if [ -z "$JWT_SECRET" ]; then
            echo "ERROR: JWT_SECRET secret is not set in the repo. Aborting deploy." >&2
            exit 1
          fi
          if [ -z "$POSTGRES_USER" ] || [ -z "$POSTGRES_PASSWORD" ]; then
            echo "ERROR: POSTGRES_USER / POSTGRES_PASSWORD secrets are not set in the repo. Aborting deploy." >&2
            exit 1
          fi
          if [ -z "$SEED_ADMIN_PASSWORD" ]; then
            echo "ERROR: SEED_ADMIN_PASSWORD secret is not set in the repo. Aborting deploy." >&2
            exit 1
          fi

          # Per-client secrets live on this server, not in GitHub
          # (scripts/provision/client-secrets.sh, docs/CLIENT_SECRETS.md).
          # `ensure` creates the data encryption key on the first deploy and
          # never replaces it; a missing or malformed key stops the deploy
          # here, before anything is built or restarted.
          sudo bash scripts/provision/client-secrets.sh ensure "$CLIENT_NAME"
          eval "$(sudo bash scripts/provision/client-secrets.sh export "$CLIENT_NAME")"
          echo "::add-mask::$DATA_ENCRYPTION_KEY"
          [ -n "$DATA_ENCRYPTION_KEY_PREVIOUS" ] && echo "::add-mask::$DATA_ENCRYPTION_KEY_PREVIOUS"
          if [ -z "$DATA_ENCRYPTION_KEY" ]; then
            echo "ERROR: no DATA_ENCRYPTION_KEY for client '$CLIENT_NAME'. Aborting deploy." >&2
            exit 1
          fi

          # Update host NGINX client_max_body_size to 250M and reload configuration
          sudo sed -i 's/client_max_body_size.*/client_max_body_size 250m;/g' /etc/nginx/nginx.conf 2>/dev/null || true
          sudo sed -i 's/client_max_body_size.*/client_max_body_size 250m;/g' /etc/nginx/sites-available/default 2>/dev/null || true
          sudo cp nginx/mercon-api.conf /etc/nginx/sites-available/mercon-api.conf 2>/dev/null || true
          sudo nginx -s reload 2>/dev/null || true


          # Keep the images now serving production as :previous before the
          # build replaces :latest — a fast rollback without rebuilding (see
          # "Restore instructions" below). The :previous from the release
          # before becomes dangling and the next prune removes it, so this
          # holds one extra image set, not a growing pile.
          for IMG in mercon-mercon-api mercon-mercon-frontend; do
            if docker image inspect "$IMG:latest" >/dev/null 2>&1; then
              docker tag "$IMG:latest" "$IMG:previous"
              echo "Kept $IMG:previous ($(docker image inspect -f '{{.Id}}' "$IMG:previous" | cut -c8-19))"
            fi
          done

          # Free up disk space from previous builds and dangling layers to prevent ENOSPC errors
          echo "Pruning dangling Docker images and build cache to ensure disk space..."
          docker builder prune -af --filter "until=24h" 2>/dev/null || docker builder prune -af 2>/dev/null || true
          docker image prune -f 2>/dev/null || true
          df -h / || true

          # Build first (running container untouched), migrate the database
          # against the newly built image, then replace the container. This
          # workflow previously ran `docker compose up -d --build` with no
          # migration step at all — schema changes never reached this
          # database on a direct push to main. Mirrors ci-cd-dev.yml, which
          # has done this correctly since it was introduced.
          echo "Building images..."
          # One image at a time: building the API and the web dashboard in
          # parallel peaked above this host's 3.8 GB RAM and the OOM killer took
          # out docker-buildx and the runner service with it (2026-09-27).
          docker compose -p mercon build mercon-api
          docker compose -p mercon build mercon-frontend

          # Uploaded documents (PODs, photos, logos) move out of /tmp, which
          # Ubuntu empties at boot, into /var/lib/mercon (docker-compose.yml).
          # Copy only — the /tmp originals stay until someone removes them by
          # hand. A file that fails to copy stops the deploy here, before the
          # database or the containers are touched. Must run before the first
          # `docker compose run` below, which would otherwise let Docker
          # create the new directories root-owned. Pass 2 after the container
          # swap picks up anything uploaded while this deploy was running.
          echo "Migrating uploads to persistent storage (pass 1)..."
          sudo bash scripts/provision/migrate-uploads.sh /tmp/mercon-uploads "$APP_UPLOADS_DIR"
          sudo bash scripts/provision/migrate-uploads.sh /tmp/uploads "$TMP_UPLOADS_DIR"

          # Back up production right before the migration (after the slow
          # build, so the dump is as close as possible to the moment the schema
          # changes). A failed or empty dump aborts the deploy before anything
          # is touched. Same format/location as backup-db.yml, so its 7-day
          # pruning covers these too. A first deploy with no database yet has
          # nothing to back up and continues.
          if [ "$(docker inspect -f '{{.State.Running}}' mercon-postgres 2>/dev/null)" = "true" ]; then
            BACKUP_DIR="/var/backups/mercon"
            sudo mkdir -p "$BACKUP_DIR"
            sudo chown "$(whoami)" "$BACKUP_DIR"
            BACKUP_PATH="$BACKUP_DIR/mercon-db-predeploy-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}.dump"
            echo "Backing up production database to $BACKUP_PATH ..."
            docker exec mercon-postgres pg_dump -U "$POSTGRES_USER" -Fc -d mercon_db > "$BACKUP_PATH"
            if [ ! -s "$BACKUP_PATH" ]; then
              echo "::error::Pre-deploy backup is empty or missing ($BACKUP_PATH). Aborting before migrations — production untouched." >&2
              exit 1
            fi
            echo "✓ Backup created: $BACKUP_PATH ($(du -h "$BACKUP_PATH" | cut -f1))"
            echo "BACKUP_PATH=$BACKUP_PATH" >> "$GITHUB_ENV"
          else
            echo "::warning::mercon-postgres is not running — no existing database to back up (first deploy?)."
          fi

          echo "Executing Prisma database migrations against production database..."
          docker compose -p mercon run --rm --no-deps mercon-api npx prisma migrate deploy

          echo "Recreating and restarting containers..."
          docker compose -p mercon up -d --no-build

          echo "Migrating uploads to persistent storage (pass 2, after the swap)..."
          sudo bash scripts/provision/migrate-uploads.sh /tmp/mercon-uploads "$APP_UPLOADS_DIR"
          sudo bash scripts/provision/migrate-uploads.sh /tmp/uploads "$TMP_UPLOADS_DIR"

          # Give mercon-api a moment to finish starting before polling it.
          sleep 8

          # Health gate — ported from ci-cd-dev.yml, which already does this
          # for the dev stack. Without this, `docker compose up -d --build`
          # exiting 0 was being treated as "deploy succeeded" even when the
          # container was crash-looping or misconfigured (e.g. the cpus-limit
          # regression that broke dev and went unnoticed until someone
          # happened to read the raw logs).
          echo "Waiting for mercon-api service container to achieve healthy status (bounded 60s timeout)..."
          HEALTH_STATUS="unknown"
          TIMEOUT=60
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONTAINER_ID=$(docker compose -p mercon ps -q mercon-api 2>/dev/null || echo "")
            if [ -n "$CONTAINER_ID" ]; then
              HEALTH_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$CONTAINER_ID" 2>/dev/null || echo "container-not-found")
            else
              HEALTH_STATUS="container-not-found"
            fi

            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "✓ Service mercon-api container (ID: ${CONTAINER_ID:0:12}) reported healthy state after ${ELAPSED}s."
              break
            elif [ "$HEALTH_STATUS" = "unhealthy" ]; then
              echo "::error::Service mercon-api container reported UNHEALTHY state." >&2
              break
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          echo "--- mercon-api service container status ---"
          docker compose -p mercon ps mercon-api || true

          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "::error::Deployment failed! Service mercon-api container did not achieve healthy status (Status: '$HEALTH_STATUS'). Printing logs..." >&2
            echo "--- mercon-api logs (last 100 lines) ---"
            docker compose -p mercon logs --no-color --tail=100 mercon-api || true
            exit 1
          fi

          echo "--- Verifying external health endpoint ---"
          if ! curl -fsS http://127.0.0.1:3050/health; then
            echo "::error::Deployment failed! External health probe GET http://127.0.0.1:3050/health failed or returned non-200. Printing logs..." >&2
            echo "--- mercon-api logs (last 100 lines) ---"
            docker compose -p mercon logs --no-color --tail=100 mercon-api || true
            exit 1
          fi
          echo "✓ External health probe GET http://127.0.0.1:3050/health verified successfully."

          echo "--- Verifying the web dashboard ---"
          if ! curl -fsS http://127.0.0.1:3060/healthz; then
            echo "::error::Web dashboard did not answer GET http://127.0.0.1:3060/healthz." >&2
            docker compose -p mercon logs --no-color --tail=50 mercon-frontend || true
            exit 1
          fi
          echo " ← web dashboard /healthz"

          # Disk after the build. The prune above only removes build cache
          # older than 24 h; disk-guard.yml checks daily between deploys.
          USED=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          df -h / && docker system df || true
          if [ "$USED" -ge 85 ]; then
            echo "::warning::Root filesystem is ${USED}% full after this deploy."
          fi

      - name: Deploy Nginx Config & Reload
        run: |
          cd "$DEPLOY_DIR"
          echo "Deploying nginx reverse proxy config..."

          # Deploy catch-all default SSL block (rejects unknown HTTPS hosts)
          sudo cp nginx/00-default-ssl.conf /etc/nginx/sites-available/00-default-ssl.conf
          sudo ln -sf /etc/nginx/sites-available/00-default-ssl.conf /etc/nginx/sites-enabled/00-default-ssl.conf

          # Deploy production nginx config
          sudo cp nginx/mercon-api.conf /etc/nginx/sites-available/mercon-api.conf
          sudo ln -sf /etc/nginx/sites-available/mercon-api.conf /etc/nginx/sites-enabled/mercon-api.conf

          # Remove stale default config if it exists
          sudo rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true

          # Validate config before reloading to avoid taking down the server
          sudo nginx -t
          sudo systemctl reload nginx
          echo "Nginx reloaded successfully."

      # Only runs when an earlier step failed. If the failure came after the
      # backup (migration, container start, health check), print how to put
      # the database back. Old containers keep serving if the migration failed,
      # because containers are only replaced after `migrate deploy` succeeds.
      - name: Restore instructions (on failure)
        if: failure()
        run: |
          if [ -n "${BACKUP_PATH:-}" ]; then
            echo "::error::Deploy failed after the pre-deploy backup was taken."
            echo "Backup: $BACKUP_PATH"
            echo "To restore production to the pre-deploy state (run on the server):"
            echo "  docker exec -i mercon-postgres pg_restore --clean --if-exists --no-owner --no-privileges -U \"\$POSTGRES_USER\" -d mercon_db < $BACKUP_PATH"
            echo "Then put the previous release's containers back: Actions → \"Rollback Production\" (rollback-prod.yml),"
            echo "which swaps in the :previous images kept by this deploy without rebuilding."
          else
            echo "Deploy failed before any database backup or migration — the database was not touched."
            echo "If the containers were already replaced, Actions → \"Rollback Production\" restores the :previous images."
          fi
