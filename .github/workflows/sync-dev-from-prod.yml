# Refreshes the dev environment (dev.mercon.tech) with a snapshot of production
# data: every table in mercon_db and the uploaded document files. Manual only —
# never on push, never scheduled.
#
# Production and dev run on different servers, so this is two jobs: `export`
# on the prod runner dumps the database and packs the uploads into a 1-day
# workflow artifact (the same channel backup-db.yml uses for nightly dumps);
# `import` on the dev runner restores them. Read-only against production:
# nothing here can write to prod. Everything it writes goes to the dev-postgres container and
# the dev uploads directories.
#
# Two things worth knowing before you run this:
#   - It REPLACES whatever is currently in the dev database and dev uploads
#     directories. Any dev-only test data created since the last sync is gone
#     after this runs.
#   - After a sync, dev's admin/operator logins become PRODUCTION's real
#     credentials (the users table is copied as-is) — not the DEV_SEED_ADMIN_PASSWORD
#     set up when the dev stack was first created. That seeded password only
#     applies until the first sync.
name: Sync Dev DB from Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SYNC to confirm — this replaces all data in the dev environment'
        required: true
        type: string

jobs:
  export:
    name: Export production snapshot
    runs-on: [self-hosted, prod]

    # Optional extra gate: create a "dev-sync" environment in
    # Settings → Environments with a required reviewer if you want a second
    # person to approve each sync. Until created, this line is a no-op.
    environment: dev-sync

    steps:
      - name: Verify confirmation
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "SYNC" ]; then
            echo "::error::Confirmation mismatch. You must type exactly 'SYNC'." >&2
            exit 1
          fi
          if [ "$(docker inspect -f '{{.State.Running}}' mercon-postgres 2>/dev/null)" != "true" ]; then
            echo "::error::Container 'mercon-postgres' is not running." >&2
            exit 1
          fi

      - name: Dump production database and pack uploads
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/prod-snapshot" && mkdir -p "$RUNNER_TEMP/prod-snapshot"
          docker exec mercon-postgres pg_dump -U "$POSTGRES_USER" -Fc -d mercon_db > "$RUNNER_TEMP/prod-snapshot/db.dump"
          test -s "$RUNNER_TEMP/prod-snapshot/db.dump"
          # The API mounts two upload directories (see docker-compose.yml).
          sudo tar -czf "$RUNNER_TEMP/prod-snapshot/uploads-app.tgz" -C /tmp/mercon-uploads .
          sudo tar -czf "$RUNNER_TEMP/prod-snapshot/uploads-tmp.tgz" -C /tmp/uploads .
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/prod-snapshot"
          du -h "$RUNNER_TEMP"/prod-snapshot/*

      - name: Hand over to the dev server
        uses: actions/upload-artifact@v4
        with:
          name: prod-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/prod-snapshot
          retention-days: 1

      - name: Remove local copy
        if: always()
        run: rm -rf "$RUNNER_TEMP/prod-snapshot"

  import:
    name: Restore snapshot into dev
    needs: export
    runs-on: [self-hosted, dev]

    steps:
      - name: Fetch snapshot
        uses: actions/download-artifact@v4
        with:
          name: prod-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/prod-snapshot

      - name: Restore into dev database
        env:
          DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER }}
        run: |
          set -euo pipefail
          if [ "$(docker inspect -f '{{.State.Running}}' dev-postgres 2>/dev/null)" != "true" ]; then
            echo "::error::Container 'dev-postgres' is not running." >&2
            exit 1
          fi
          docker cp "$RUNNER_TEMP/prod-snapshot/db.dump" dev-postgres:/tmp/prod-sync.dump
          # --no-owner/--no-privileges: prod's Postgres role doesn't exist in
          # the dev instance. --clean --if-exists: a clean replace, not a merge.
          docker exec dev-postgres pg_restore \
            --clean --if-exists --no-owner --no-privileges \
            -U "$DEV_POSTGRES_USER" -d mercon_dev_db /tmp/prod-sync.dump
          docker exec dev-postgres rm -f /tmp/prod-sync.dump

      - name: Replace dev uploaded files
        run: |
          set -euo pipefail
          # Same two mounts as docker-compose.yml with CLIENT_NAME=dev and
          # DEV_UPLOADS_DIR=/var/lib/mercon/dev-uploads (ci-cd-dev.yml).
          for pair in "uploads-app.tgz:/tmp/dev-uploads" "uploads-tmp.tgz:/var/lib/mercon/dev-uploads"; do
            archive="${pair%%:*}"; target="${pair#*:}"
            sudo mkdir -p "$target"
            sudo find "$target" -mindepth 1 -delete
            sudo tar -xzf "$RUNNER_TEMP/prod-snapshot/$archive" -C "$target"
            echo "$target: $(sudo du -sh "$target" | cut -f1)"
          done

      - name: Restart dev app containers
        run: |
          set -euo pipefail
          docker restart dev-api dev-frontend
          rm -rf "$RUNNER_TEMP/prod-snapshot"

      - name: Summary
        run: |
          {
            echo "## Dev synced from production"
            echo
            echo "Dev database and uploaded files now mirror production as of $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "⚠️ Dev admin/operator logins are now production's real credentials, not the original DEV_SEED_ADMIN_PASSWORD."
          } >> "$GITHUB_STEP_SUMMARY"
