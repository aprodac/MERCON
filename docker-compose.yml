# Every name/port/volume below defaults to Mercon's existing values, so this
# file behaves identically for Mercon with zero env changes. A second client
# (e.g. MTL) runs this same compose file on its own VPS with CLIENT_NAME,
# POSTGRES_DB, and the port vars set in that host's .env — see
# PROGRESS.md's new-client provisioning notes.
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "3"

services:
  postgres-db:
    <<: *default-logging
    image: postgres:15-alpine
    container_name: "${CLIENT_NAME:-mercon}-postgres"
    restart: unless-stopped
    # Caps so one container can't starve the others on a shared VPS (this host
    # also runs unrelated non-Mercon containers, AND its own prod+dev stacks
    # side by side). `cpus` is a throttle ceiling, not a reservation, so
    # stacks can safely oversubscribe it — but Docker hard-rejects any single
    # service's `cpus` above the host's actual CPU count (this host has 1),
    # so keep each service's default comfortably under 1.0. Override per-host
    # via env if a client's VPS has more to spare.
    mem_limit: "${POSTGRES_MEM_LIMIT:-512m}"
    cpus: "${POSTGRES_CPU_LIMIT:-0.5}"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be provided (set it as a GitHub Actions secret / env var)}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided (set it as a GitHub Actions secret / env var)}"
      POSTGRES_DB: "${POSTGRES_DB:-mercon_db}"
    ports:
      - "127.0.0.1:${DB_TUNNEL_PORT:-15432}:5432" # Localhost-only: tunnel in via SSH for Beekeeper Studio, never exposed publicly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ${POSTGRES_DB:-mercon_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mercon-api:
    <<: *default-logging
    build:
      context: .
      dockerfile: backend/api-server/Dockerfile
    container_name: "${CLIENT_NAME:-mercon}-api"
    restart: unless-stopped
    mem_limit: "${API_MEM_LIMIT:-768m}"
    cpus: "${API_CPU_LIMIT:-0.75}"
    ports:
      # Loopback only: host nginx is the one client (proxy_pass 127.0.0.1).
      # Published on all interfaces, Docker's iptables rules bypass UFW and
      # the API was reachable from the internet without TLS.
      - "127.0.0.1:${API_PORT:-3050}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER must be provided}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}@postgres-db:5432/${POSTGRES_DB:-mercon_db}?schema=public"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be provided (set it as a GitHub Actions secret / env var)}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be provided (set it as a GitHub Actions secret / env var)}"
      # ICCES GPS tracking. Optional — unset simply disables polling, so these
      # use ${VAR:-} rather than the :? form the required secrets above use.
      # Without these lines the credentials could not reach the container at
      # all, which is why the tracker integration never once ran against the
      # real service despite being written a month earlier.
      ICCES_USER: "${ICCES_USER:-}"
      ICCES_PASS: "${ICCES_PASS:-}"
      ICCES_ACCT: "${ICCES_ACCT:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      # Customer links (/t/, /c/, /s/) on their own address, e.g.
      # https://track.mercon.tech. Empty: links use the dashboard's address.
      TRACKING_BASE_URL: "${TRACKING_BASE_URL:-}"
      # Encrypts stored integration secrets (ZATCA certificate key etc.).
      # Comes from this client's own server, not GitHub:
      # /etc/aprodac/clients/<client>/secrets.env, created and exported by
      # scripts/provision/client-secrets.sh in the deploy workflow, which
      # refuses to deploy without it. `:-` rather than `:?` because every
      # `docker compose` command interpolates this file, including read-only
      # ones in other workflows (db-inspect) that never need the key.
      # Rotation: docs/CLIENT_SECRETS.md.
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
      DATA_ENCRYPTION_KEY_PREVIOUS: "${DATA_ENCRYPTION_KEY_PREVIOUS:-}"
      # Road routing (ETAs, route lines). Production sets http://osrm:5000 —
      # the `osrm` service below. Empty: the public OSRM demo, as before. Our
      # own server unreachable → the API asks the public one instead
      # (services/routing/routeProvider.ts), so this never breaks routing.
      OSRM_BASE_URL: "${OSRM_BASE_URL:-}"
      ROUTE_TRUCK_MAX_KPH: "${ROUTE_TRUCK_MAX_KPH:-}"
      PORT: 3000
    volumes:
      # Persistent host directories under /var/lib/mercon, one pair per
      # CLIENT_NAME so two stacks on one host never share uploaded documents.
      # Never /tmp: Ubuntu empties /tmp at boot, which would delete every POD,
      # photo and logo (they lived there until 2026-09; the deploy workflows
      # copy them across with scripts/provision/migrate-uploads.sh).
      #   <client>-app-uploads → older files written under the app directory
      #   <client>-uploads     → current writes (UPLOADS_DIR is unset, so the
      #                          API writes to /tmp/uploads inside the container)
      - "${APP_UPLOADS_DIR:-/var/lib/mercon/${CLIENT_NAME:-mercon}-app-uploads}:/app/backend/api-server/uploads"
      - "${TMP_UPLOADS_DIR:-/var/lib/mercon/${CLIENT_NAME:-mercon}-uploads}:/tmp/uploads"
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mercon-frontend:
    <<: *default-logging
    build:
      context: .
      dockerfile: frontend/web-dashboard/Dockerfile
      args:
        # Vite inlines VITE_* at build time, so this is a build arg rather than
        # a runtime `environment:` entry — the bundle is already written by the
        # time a container starts.
        #
        # `:-` (default empty), not `:?` (required), on purpose: an absent key
        # means address search falls back to Nominatim, so the stack still
        # builds and runs for anyone without the secret. JWT_SECRET below uses
        # `:?` because a missing one is genuinely unserviceable; this is not.
        VITE_GOOGLE_MAPS_API_KEY: "${VITE_GOOGLE_MAPS_API_KEY:-}"
    container_name: "${CLIENT_NAME:-mercon}-frontend"
    restart: unless-stopped
    mem_limit: "${FRONTEND_MEM_LIMIT:-256m}"
    cpus: "${FRONTEND_CPU_LIMIT:-0.25}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3060}:80" # Loopback only, behind host nginx (see mercon-api)
    healthcheck:
      # nginx:alpine ships busybox wget, not curl. 127.0.0.1, not localhost:
      # inside the container localhost resolves to ::1 first and nginx only
      # listens on IPv4, so the check failed and the container showed
      # "unhealthy" while serving normally.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Our own road-routing server (OSRM) — free, no request limits, ETAs on real
  # roads. Optional: in the `routing` profile, so a normal deploy (`docker
  # compose up` without --profile) never starts, stops or waits for it, and
  # nothing fails while it isn't installed. Its map data is built off this
  # host (it needs more RAM than this VPS has) and installed by
  # .github/workflows/build-osrm.yml, which also starts this service.
  # Read-only data, mmap'd: the route server itself stays small.
  # docs/infra/ROUTING.md.
  osrm:
    <<: *default-logging
    image: "${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}"
    container_name: "${CLIENT_NAME:-mercon}-osrm"
    profiles: ["routing"]
    restart: unless-stopped
    mem_limit: "${OSRM_MEM_LIMIT:-1g}"
    cpus: "${OSRM_CPU_LIMIT:-0.5}"
    command: ["osrm-routed", "--algorithm", "mld", "--mmap", "/data/map.osrm"]
    volumes:
      # A symlink to the live release; build-osrm.yml points it at a new one
      # and recreates this container (Docker resolves it at creation).
      - "${OSRM_DATA_DIR:-/var/lib/mercon/osrm/current}:/data:ro"
    # No published port: only the API reaches it, as http://osrm:5000.

volumes:
  # Deliberately not given an explicit name: each client runs this compose
  # file on its own VPS (separate Docker daemon, separate volume namespace),
  # so there is no cross-client collision to guard against — and explicitly
  # naming it risks pointing at a different volume than the one Docker
  # auto-generated for Mercon's existing deploy, which would look like a
  # fresh empty database on next deploy. Not worth that risk for no benefit.
  pgdata:
